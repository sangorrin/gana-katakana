name: Build iOS App (iPhone & iPad)

on:
  release:
    types: [published, created]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install --include=optional --legacy-peer-deps
          npm install --no-save --legacy-peer-deps lightningcss-darwin-arm64 @rolldown/binding-darwin-arm64 || true

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Xcode Archive (iOS Universal)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package App and Unsigned IPA
        run: |
          cd ios/App
          mkdir -p dist-ios/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app dist-ios/Payload/
          cd dist-ios
          zip -r GanaKatakana-ios-unsigned.ipa Payload
          zip -r GanaKatakana-ios-app.zip Payload/App.app

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GanaKatakana-iOS-Package
          path: |
            ios/App/dist-ios/GanaKatakana-ios-unsigned.ipa
            ios/App/dist-ios/GanaKatakana-ios-app.zip
          retention-days: 30

      - name: Attach iOS Build to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ios/App/dist-ios/GanaKatakana-ios-unsigned.ipa
            ios/App/dist-ios/GanaKatakana-ios-app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
